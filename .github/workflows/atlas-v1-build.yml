name: Atlas v1 no-AI build gate

on:
  push:
    branches: [atlas-v1-no-ai]

permissions:
  contents: write

jobs:
  build-and-commit:
    if: github.event.head_commit.message != 'Implement Atlas v1 without paid AI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: atlas-v1-no-ai

      - name: Create Atlas v1 implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/features/atlas

          cat > src/features/atlas/buildAtlas.ts <<'EOF'
          import type { Book } from "../../catalog";
          import { collections, countries, centuries, epochs, genres, movements, themes } from "../../catalog";

          export type AtlasReasonKind =
            | "author"
            | "theme"
            | "movement"
            | "epoch"
            | "collection"
            | "genre"
            | "country"
            | "century"
            | "time";

          export interface AtlasReason {
            kind: AtlasReasonKind;
            label: string;
            weight: number;
          }

          export interface AtlasConnection {
            id: string;
            left: Book;
            right: Book;
            score: number;
            strength: "strong" | "medium";
            reasons: AtlasReason[];
          }

          const countryLabels = new Map(countries.map(term => [term.id, term.label]));
          const centuryLabels = new Map(centuries.map(term => [term.id, term.label]));
          const epochLabels = new Map(epochs.map(term => [term.id, term.label]));
          const movementLabels = new Map(movements.map(term => [term.id, term.label]));
          const genreLabels = new Map(genres.map(term => [term.id, term.label]));
          const themeLabels = new Map(themes.map(term => [term.id, term.label]));
          const collectionLabels = new Map(collections.map(item => [item.id, item.title]));

          function shared(left: string[], right: string[]): string[] {
            const rightSet = new Set(right);
            return left.filter(value => rightSet.has(value));
          }

          function labels(ids: string[], dictionary: Map<string, string>): string {
            return ids.map(id => dictionary.get(id) ?? id).join(", ");
          }

          function addReason(reasons: AtlasReason[], kind: AtlasReasonKind, label: string, weight: number): void {
            reasons.push({ kind, label, weight });
          }

          export function scoreAtlasPair(left: Book, right: Book): AtlasConnection | null {
            if (left.id === right.id) return null;

            const reasons: AtlasReason[] = [];

            if (left.authorId === right.authorId) {
              addReason(reasons, "author", `Один автор: ${left.authorName}`, 8);
            }

            const sharedThemes = shared(left.themeIds, right.themeIds);
            if (sharedThemes.length) {
              addReason(
                reasons,
                "theme",
                `Общие темы: ${labels(sharedThemes, themeLabels)}`,
                5 + Math.max(0, sharedThemes.length - 1) * 2
              );
            }

            if (left.movementId && left.movementId === right.movementId) {
              addReason(
                reasons,
                "movement",
                `Одно направление: ${movementLabels.get(left.movementId) ?? left.movementId}`,
                4
              );
            }

            if (left.epochId && left.epochId === right.epochId) {
              addReason(
                reasons,
                "epoch",
                `Одна эпоха: ${epochLabels.get(left.epochId) ?? left.epochId}`,
                3
              );
            }

            const sharedCollections = shared(left.collectionIds, right.collectionIds);
            if (sharedCollections.length) {
              addReason(
                reasons,
                "collection",
                `Вместе в подборках: ${labels(sharedCollections, collectionLabels)}`,
                3 + Math.max(0, sharedCollections.length - 1) * 2
              );
            }

            const sharedGenres = shared(left.genreIds, right.genreIds);
            if (sharedGenres.length) {
              addReason(
                reasons,
                "genre",
                `Общий жанр: ${labels(sharedGenres, genreLabels)}`,
                2 + Math.max(0, sharedGenres.length - 1)
              );
            }

            if (left.countryId && left.countryId === right.countryId) {
              addReason(
                reasons,
                "country",
                `Одна литературная традиция: ${countryLabels.get(left.countryId) ?? left.countryId}`,
                2
              );
            }

            if (left.centuryId && left.centuryId === right.centuryId) {
              addReason(
                reasons,
                "century",
                `Один период: ${centuryLabels.get(left.centuryId) ?? left.centuryId}`,
                1
              );
            }

            if (left.publicationYear && right.publicationYear) {
              const distance = Math.abs(left.publicationYear - right.publicationYear);
              if (distance <= 15) {
                addReason(reasons, "time", `Опубликованы с разницей ${distance} ${distance === 1 ? "год" : "лет"}`, 1);
              }
            }

            const score = reasons.reduce((sum, reason) => sum + reason.weight, 0);
            if (score < 4) return null;

            const [firstId, secondId] = [left.id, right.id].sort();
            return {
              id: `${firstId}::${secondId}`,
              left,
              right,
              score,
              strength: score >= 8 ? "strong" : "medium",
              reasons: reasons.sort((a, b) => b.weight - a.weight || a.label.localeCompare(b.label))
            };
          }

          export function buildAtlasConnections(books: Book[], limit = 36): AtlasConnection[] {
            const uniqueBooks = Array.from(new Map(books.map(book => [book.id, book])).values());
            const connections: AtlasConnection[] = [];

            for (let leftIndex = 0; leftIndex < uniqueBooks.length; leftIndex += 1) {
              for (let rightIndex = leftIndex + 1; rightIndex < uniqueBooks.length; rightIndex += 1) {
                const connection = scoreAtlasPair(uniqueBooks[leftIndex], uniqueBooks[rightIndex]);
                if (connection) connections.push(connection);
              }
            }

            return connections
              .sort((a, b) => b.score - a.score || a.left.title.localeCompare(b.left.title) || a.right.title.localeCompare(b.right.title))
              .slice(0, limit);
          }
          EOF

          cat > src/features/atlas/AtlasView.tsx <<'EOF'
          import { useEffect, useState } from "react";
          import { useAuth } from "../../auth/supabaseAuth";
          import { fetchAndMergeWorksByIds, listLibrary, type LibraryEntry } from "../../api/userLibrary";
          import { getBookById } from "../../catalog";
          import type { Book } from "../../catalog";
          import { GuestNotice } from "../shared/GuestNotice";
          import { ShellPage } from "../shared/ShellPage";
          import { buildAtlasConnections, type AtlasConnection } from "./buildAtlas";

          interface AtlasViewProps {
            onBack: () => void;
            onOpenBookDetail: (bookId: string) => void;
            onRequireSignIn: () => void;
          }

          interface AtlasState {
            entries: LibraryEntry[];
            activeBooks: Book[];
            connections: AtlasConnection[];
          }

          const EMPTY_ATLAS: AtlasState = {
            entries: [],
            activeBooks: [],
            connections: []
          };

          export function AtlasView({ onBack, onOpenBookDetail, onRequireSignIn }: AtlasViewProps) {
            const { isAuthenticated } = useAuth();
            const [atlas, setAtlas] = useState<AtlasState>(EMPTY_ATLAS);
            const [isLoading, setLoading] = useState(false);
            const [error, setError] = useState<string | null>(null);

            useEffect(() => {
              let cancelled = false;

              if (!isAuthenticated) {
                setAtlas(EMPTY_ATLAS);
                setLoading(false);
                setError(null);
                return () => {
                  cancelled = true;
                };
              }

              async function loadAtlas(): Promise<void> {
                setLoading(true);
                setError(null);

                try {
                  const entries = await listLibrary();
                  const activeEntries = entries.filter(entry => entry.status === "reading" || entry.status === "finished");
                  const workIds = Array.from(new Set(activeEntries.map(entry => entry.workId)));

                  await fetchAndMergeWorksByIds(workIds);

                  if (cancelled) return;

                  const activeBooks = workIds
                    .map(workId => getBookById(workId))
                    .filter((book): book is Book => Boolean(book));

                  setAtlas({
                    entries,
                    activeBooks,
                    connections: buildAtlasConnections(activeBooks)
                  });
                } catch (loadError) {
                  console.error("Atlas load failed:", loadError);
                  if (!cancelled) setError("Не удалось собрать Atlas из вашей библиотеки.");
                } finally {
                  if (!cancelled) setLoading(false);
                }
              }

              void loadAtlas();

              return () => {
                cancelled = true;
              };
            }, [isAuthenticated]);

            const readingCount = atlas.entries.filter(entry => entry.status === "reading").length;
            const finishedCount = atlas.entries.filter(entry => entry.status === "finished").length;
            const wantToReadCount = atlas.entries.filter(entry => entry.status === "want_to_read").length;

            return (
              <ShellPage
                onBack={onBack}
                eyebrow="Atlas"
                title="Ваш интеллектуальный Atlas"
                subtitle="Связи между книгами, которые уже существуют в вашей истории чтения."
              >
                {!isAuthenticated ? (
                  <>
                    <GuestNotice message="Atlas собирается из вашей личной истории чтения. Войдите, чтобы AN.KI мог помнить прочитанные книги и связи между ними." />
                    <button type="button" className="primary-button" onClick={onRequireSignIn}>
                      Войти
                    </button>
                  </>
                ) : isLoading ? (
                  <GuestNotice message="Собираем Atlas из вашей библиотеки…" />
                ) : error ? (
                  <GuestNotice message={error} />
                ) : (
                  <>
                    <section className="subscription-current">
                      <h2>Atlas v1 работает без платного AI</h2>
                      <p className="settings-section-note">
                        Сейчас связи строятся только из проверяемых данных AN.KI: авторов, тем, направлений, эпох, жанров,
                        литературных традиций, подборок и времени публикации. Ни один запрос к OpenAI для этой страницы не выполняется.
                      </p>
                    </section>

                    <section className="subscription-blocks" aria-label="Состояние Atlas">
                      <div className="subscription-block">
                        <h2>{atlas.activeBooks.length}</h2>
                        <p className="settings-section-note">книг уже участвуют в Atlas</p>
                      </div>
                      <div className="subscription-block">
                        <h2>{atlas.connections.length}</h2>
                        <p className="settings-section-note">проверяемых связей найдено</p>
                      </div>
                      <div className="subscription-block">
                        <h2>{readingCount}</h2>
                        <p className="settings-section-note">сейчас читаете</p>
                      </div>
                      <div className="subscription-block">
                        <h2>{finishedCount}</h2>
                        <p className="settings-section-note">завершено</p>
                      </div>
                    </section>

                    {wantToReadCount > 0 && (
                      <p className="settings-section-note">
                        Ещё {wantToReadCount} книг в «Хочу прочитать» пока не влияют на Atlas: книга входит в интеллектуальную историю,
                        когда чтение действительно началось.
                      </p>
                    )}

                    {atlas.activeBooks.length < 2 ? (
                      <GuestNotice message="Для первой связи нужны хотя бы две книги со статусом «Читаю» или «Прочитано»." />
                    ) : atlas.connections.length === 0 ? (
                      <GuestNotice message="Книги уже в Atlas, но по текущим проверяемым метаданным между ними пока нет достаточно сильной связи." />
                    ) : (
                      <section className="subscription-plans" aria-label="Связи между книгами">
                        {atlas.connections.map(connection => (
                          <article key={connection.id} className={connection.strength === "strong" ? "plan-card plan-card-highlighted" : "plan-card"}>
                            <p className="eyebrow">{connection.strength === "strong" ? "Сильная связь" : "Связь"}</p>
                            <h3 className="plan-card-name">{connection.left.title}</h3>
                            <p className="settings-section-note">{connection.left.authorName}</p>
                            <p className="plan-card-price" aria-hidden="true">↔</p>
                            <h3 className="plan-card-name">{connection.right.title}</h3>
                            <p className="settings-section-note">{connection.right.authorName}</p>
                            <ul className="plan-card-features">
                              {connection.reasons.map(reason => (
                                <li key={`${connection.id}-${reason.kind}-${reason.label}`}>{reason.label}</li>
                              ))}
                            </ul>
                            <div>
                              <button type="button" className="text-link" onClick={() => onOpenBookDetail(connection.left.id)}>
                                Открыть «{connection.left.title}»
                              </button>
                            </div>
                            <div>
                              <button type="button" className="text-link" onClick={() => onOpenBookDetail(connection.right.id)}>
                                Открыть «{connection.right.title}»
                              </button>
                            </div>
                          </article>
                        ))}
                      </section>
                    )}

                    <section className="subscription-current">
                      <h2>Что добавит AI позже</h2>
                      <p className="settings-section-note">
                        AI-слой будет находить связи, которых нет в каталожной разметке: общие идеи внутри текста, противоречия,
                        развитие одной темы между авторами и связи с вашими будущими заметками и выделениями. Он будет дополнять Atlas,
                        а не заменять уже работающую память и проверяемые связи.
                      </p>
                    </section>
                  </>
                )}
              </ShellPage>
            );
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          menu = Path("src/app/AccountMenu.tsx")
          text = menu.read_text()
          old = '''export type AccountShellView =
            | "profile"
            | "my-library"
            | "notes"
            | "subscription"
            | "settings"
            | "support";'''
          new = '''export type AccountShellView =
            | "profile"
            | "my-library"
            | "atlas"
            | "notes"
            | "subscription"
            | "settings"
            | "support";'''
          assert old in text, "AccountShellView union changed upstream"
          text = text.replace(old, new, 1)
          old = '''          <button type="button" role="menuitem" onClick={() => go("my-library")}>Моя библиотека</button>
                    <button type="button" role="menuitem" onClick={() => go("notes")}>Заметки</button>'''
          new = '''          <button type="button" role="menuitem" onClick={() => go("my-library")}>Моя библиотека</button>
                    <button type="button" role="menuitem" onClick={() => go("atlas")}>Atlas</button>
                    <button type="button" role="menuitem" onClick={() => go("notes")}>Заметки</button>'''
          assert old in text, "Account menu list changed upstream"
          menu.write_text(text.replace(old, new, 1))

          app = Path("src/App.tsx")
          text = app.read_text()
          old = 'import { MyLibraryView } from "./features/my-library/MyLibraryView";\n'
          new = old + 'import { AtlasView } from "./features/atlas/AtlasView";\n'
          assert old in text, "App imports changed upstream"
          text = text.replace(old, new, 1)

          old = '''  | { type: "library"; state: LibraryRestoreState }
            // USER LIBRARY PHASE (requirement #18): mirrors the "library" origin'''
          new = '''  | { type: "library"; state: LibraryRestoreState }
            | { type: "atlas" }
            // USER LIBRARY PHASE (requirement #18): mirrors the "library" origin'''
          assert old in text, "BookDetailOrigin changed upstream"
          text = text.replace(old, new, 1)

          old = '''    if (bookDetailOrigin?.type === "my-library") {
              setMyLibraryRestoreState(bookDetailOrigin.state);
              setView("my-library");
              return;
            }

            setView("home");'''
          new = '''    if (bookDetailOrigin?.type === "my-library") {
              setMyLibraryRestoreState(bookDetailOrigin.state);
              setView("my-library");
              return;
            }

            if (bookDetailOrigin?.type === "atlas") {
              setView("atlas");
              return;
            }

            setView("home");'''
          assert old in text, "Book Detail back handler changed upstream"
          text = text.replace(old, new, 1)

          old = '''  } else if (view === "notes") {
              content = <NotesView onBack={handleBackFromAccountShell} />;
            } else if (view === "subscription") {'''
          new = '''  } else if (view === "atlas") {
              content = (
                <AtlasView
                  onBack={handleBackFromAccountShell}
                  onOpenBookDetail={bookId => handleOpenBookDetail(bookId, { type: "atlas" })}
                  onRequireSignIn={handleRequireSignIn}
                />
              );
            } else if (view === "notes") {
              content = <NotesView onBack={handleBackFromAccountShell} />;
            } else if (view === "subscription") {'''
          assert old in text, "Account shell render chain changed upstream"
          app.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Atlas deterministic relation smoke test
        shell: bash
        run: |
          cat > .atlas-smoke.ts <<'EOF'
          import { scoreAtlasPair } from "./src/features/atlas/buildAtlas";
          import type { Book } from "./src/catalog";

          const makeBook = (overrides: Partial<Book>): Book => ({
            id: "base",
            title: "Base",
            originalTitle: null,
            alternativeTitles: [],
            authorId: "author-a",
            authorName: "Author A",
            originalLanguage: "en",
            availableLanguages: ["en"],
            publicationYear: 1900,
            countryId: null,
            centuryId: null,
            epochId: null,
            movementId: null,
            genreIds: [],
            themeIds: [],
            description: "",
            cover: null,
            editions: [],
            collectionIds: [],
            ...overrides
          });

          const crime = makeBook({
            id: "crime-and-punishment",
            title: "Преступление и наказание",
            authorId: "dostoevsky",
            authorName: "Фёдор Достоевский",
            publicationYear: 1866,
            countryId: "russian-literature",
            centuryId: "19",
            epochId: "long-nineteenth-century",
            movementId: "realism",
            genreIds: ["novel"],
            themeIds: ["morality", "identity"],
            collectionIds: ["russian-classics", "great-19th-century-novels"]
          });

          const anna = makeBook({
            id: "anna-karenina",
            title: "Анна Каренина",
            authorId: "tolstoy",
            authorName: "Лев Толстой",
            publicationYear: 1877,
            countryId: "russian-literature",
            centuryId: "19",
            epochId: "long-nineteenth-century",
            movementId: "realism",
            genreIds: ["novel"],
            themeIds: ["love", "family"],
            collectionIds: ["russian-classics", "great-19th-century-novels"]
          });

          const kafka = makeBook({
            id: "the-metamorphosis",
            title: "Превращение",
            authorId: "kafka",
            authorName: "Франц Кафка",
            publicationYear: 1915,
            countryId: "german-literature",
            centuryId: "20",
            epochId: "early-twentieth-century",
            movementId: "modernism",
            genreIds: ["novella"],
            themeIds: ["alienation", "family", "identity"]
          });

          const unrelated = makeBook({ id: "unrelated", title: "Unrelated", authorId: "other", authorName: "Other", publicationYear: 1700 });

          const historical = scoreAtlasPair(crime, anna);
          const thematic = scoreAtlasPair(crime, kafka);
          const none = scoreAtlasPair(crime, unrelated);

          if (!historical || historical.score < 8) throw new Error("Expected strong historical/taxonomy link between Crime and Punishment and Anna Karenina");
          if (!thematic || !thematic.reasons.some(reason => reason.kind === "theme")) throw new Error("Expected metadata theme link between Crime and Punishment and The Metamorphosis");
          if (none !== null) throw new Error("Unrelated books should not receive an Atlas edge");

          console.log("Atlas smoke OK", { historical: historical.score, thematic: thematic.score });
          EOF
          npx --yes tsx .atlas-smoke.ts
          rm .atlas-smoke.ts

      - name: Typecheck and build
        run: npm run build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/atlas-v1-build.yml
          git config user.name "AN.KI build bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement Atlas v1 without paid AI"
          git push origin HEAD:atlas-v1-no-ai
