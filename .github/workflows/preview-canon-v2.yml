name: Canon v2 preview

on:
  push:
    branches:
      - atlas-the-canon-redesign-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type-check and build
        run: npm run build -- --base=./

      - name: Publish isolated static preview branch
        run: |
          rm -rf /tmp/canon-preview
          cp -R dist /tmp/canon-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan canon-preview-static
          git rm -rf .
          cp -R /tmp/canon-preview/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish Canon v2 preview"
          git push --force origin HEAD:preview-atlas-the-canon-redesign-v2
