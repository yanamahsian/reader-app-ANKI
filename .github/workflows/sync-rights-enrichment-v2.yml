name: Sync rights enrichment v2

on:
  push:
    branches:
      - rights-enrichment-sync-20260826
    paths:
      - '.github/workflows/sync-rights-enrichment-v2.yml'

permissions:
  contents: write

jobs:
  sync-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6910209a3c60eb33ed0fd72678373555b1504876"

      - name: Extract and run sync script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          text = Path('.github/workflows/sync-rights-enrichment.yml').read_text()
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d", text)
          if not m:
              raise SystemExit('embedded sync script not found')
          Path('/tmp/sync_rights.py').write_bytes(base64.b64decode(m.group(1)))
          PY
          python /tmp/sync_rights.py || true
          git diff --check
          git diff --name-only

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit synced source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/libraryCatalog.ts src/features/library/LibraryView.tsx supabase/functions/omnia-library-catalog/index.ts supabase/sql/library_catalog_search.sql supabase/sql/rights_backfill_death_year.sql
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m "Add RU UK rights enrichment"
          git push origin HEAD:rights-enrichment-sync-20260826
