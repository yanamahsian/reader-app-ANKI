name: Apply language facets sync

on:
  push:
    branches:
      - language-facets-sync-20260826
    paths:
      - '.github/workflows/apply-language-facets-sync.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "49e0ff8ae98275ce54060f6f63abbb210fc2d4f4"

      - name: Apply verified patch
        run: |
          gunzip -c anki_language_facets.patch.gz > /tmp/anki_language_facets.patch
          git apply --check /tmp/anki_language_facets.patch
          git apply /tmp/anki_language_facets.patch
          rm anki_language_facets.patch.gz
          rm .github/workflows/apply-language-facets-sync.yml
          expected=$(printf '%s\n' \
            'src/api/libraryCatalog.ts' \
            'src/catalog/languages.ts' \
            'src/features/home/SearchPanel.tsx' \
            'src/features/library/LibraryView.tsx' \
            'supabase/functions/omnia-library-catalog/index.ts' \
            'supabase/sql/library_language_facets.sql' | sort)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$expected"
          git diff --check origin/main

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified facets sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add server-driven language facets'
          git push origin HEAD:language-facets-sync-20260826
