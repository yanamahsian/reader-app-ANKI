              "@vitejs/plugin-react": "^4.3.4",
              "typescript": "^5.6.3",
              "vite": "^6.0.0"
            }
          }
          __PHASE2_FILE_EOF__

          mkdir -p "src"
          cat > "src/App.tsx" << '__PHASE2_FILE_EOF__'
          import { useState } from "react";
          import { HomeView } from "./features/home/HomeView";
          import { ReaderView } from "./features/reader/ReaderView";
          import type { Book } from "./features/reader/engine/types";

          type View = "home" | "reader";

          export function App() {

            const [view, setView] = useState<View>("home");
            const [currentBook, setCurrentBook] = useState<Book | null>(null);

            function handleOpenBook(book: Book): void {
              setCurrentBook(book);
              setView("reader");
            }

            function handleExitReader(): void {
              setView("home");
            }

            if (view === "reader" && currentBook) {
              return <ReaderView book={currentBook} onExit={handleExitReader} />;
            }

            return <HomeView onOpenBook={handleOpenBook} />;

          }
          __PHASE2_FILE_EOF__

          mkdir -p "src/api"
          cat > "src/api/ai.ts" << '__PHASE2_FILE_EOF__'
          const AI_ENDPOINT =
            "https://prknybetxirzbzkvmovw.supabase.co/functions/v1/omnia-ai";

          interface TranslateResponse {
            translation: string;
          }

          interface ExplainResponse {
            answer: string;
          }

          async function callAI<T>(action: string, payload: Record<string, unknown>, signal?: AbortSignal): Promise<T> {

            const response = await fetch(AI_ENDPOINT, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              signal,
              body: JSON.stringify({ action, ...payload })
            });

            if (!response.ok) {
              throw new Error("AI request failed");
            }

            return (await response.json()) as T;

          }

          export async function translateText(text: string, language: string, signal?: AbortSignal): Promise<string> {
            const result = await callAI<TranslateResponse>("translate", { text, language }, signal);
            return result.translation;
          }

          export async function explainText(text: string, language: string, signal?: AbortSignal): Promise<string> {
            const result = await callAI<ExplainResponse>("explain", { text, language }, signal);
            return result.answer;
          }
          __PHASE2_FILE_EOF__

          mkdir -p "src/api"
          cat > "src/api/library.ts" << '__PHASE2_FILE_EOF__'
          import type { Book } from "../features/reader/engine/types";

          const LIBRARY_ENDPOINT =
            "https://prknybetxirzbzkvmovw.supabase.co/functions/v1/omnia-library";

          export interface SearchBooksParams {
            query: string;
            language?: string;
            signal?: AbortSignal;
          }

          // Wraps the existing omnia-library Edge Function as-is. The function's
          // own contract is unchanged in phase 2 — this only adds types on the
          // client side.
          export async function searchBooks(params: SearchBooksParams): Promise<Book[]> {

            const response = await fetch(LIBRARY_ENDPOINT, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                query: params.query,
                language: params.language || ""
              }),
              signal: params.signal
            });

            if (!response.ok) {
              throw new Error("Library request failed");
            }

            const data = (await response.json()) as unknown;

            if (!Array.isArray(data)) {
              throw new Error("Unexpected library response shape");
            }

            return data as Book[];

          }
          __PHASE2_FILE_EOF__

          mkdir -p "src/features/home"
          cat > "src/features/home/Hero.tsx" << '__PHASE2_FILE_EOF__'
          import { useEffect, useState } from "react";

          const HERO_COUNT = 45;
          const HERO_DELAY = 7000;

          function heroImagePath(n: number): string {
            return `${import.meta.env.BASE_URL}Hero/hero_${n}.png`;
          }

          function heroBackground(n: number): string {
            return `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),url("${heroImagePath(n)}")`;
          }

          interface HeroProps {
            onOpenSearch: () => void;
          }

          // Same crossfade approach as the original vanilla implementation: two
          // persistent layers (A/B), the inactive one gets the next image applied
          // before it becomes active, so the CSS opacity transition on
          // .hero-image.active still runs.
          export function Hero({ onOpenSearch }: HeroProps) {

            const initialIndex = () => Math.floor(Math.random() * HERO_COUNT);

            const [slotAIndex, setSlotAIndex] = useState<number>(initialIndex);
            const [slotBIndex, setSlotBIndex] = useState<number>(initialIndex);
            const [activeSlot, setActiveSlot] = useState<"A" | "B">("A");
            const [displayIndex, setDisplayIndex] = useState<number>(() => slotAIndex);

            function rotateTo(nextIndex: number): void {
              if (activeSlot === "A") {
                setSlotBIndex(nextIndex);
                setActiveSlot("B");
              } else {
                setSlotAIndex(nextIndex);
                setActiveSlot("A");
              }
              setDisplayIndex(nextIndex);
            }

            function rotateRandom(): void {
              let next = displayIndex;
              while (next === displayIndex) {
                next = Math.floor(Math.random() * HERO_COUNT);
              }
              rotateTo(next);
            }

            function goNext(): void {
              rotateTo((displayIndex + 1) % HERO_COUNT);
            }

            function goPrevious(): void {
              rotateTo((displayIndex - 1 + HERO_COUNT) % HERO_COUNT);
            }

            useEffect(() => {
              for (let i = 1; i <= HERO_COUNT; i++) {
                const img = new Image();
                img.src = heroImagePath(i);
              }
            }, []);

            useEffect(() => {
              const timer = window.setInterval(rotateRandom, HERO_DELAY);
              return () => window.clearInterval(timer);
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [displayIndex, activeSlot]);

            const counter = `${String(displayIndex + 1).padStart(2, "0")} / ${String(HERO_COUNT).padStart(2, "0")}`;

            return (
              <section id="hero" className="hero" aria-label="AN.KI Atlas">

                <div
                  className={"hero-image hero-image-a" + (activeSlot === "A" ? " active" : "")}
                  style={{ backgroundImage: heroBackground(slotAIndex) }}
                />

                <div
                  className={"hero-image hero-image-b" + (activeSlot === "B" ? " active" : "")}
                  style={{ backgroundImage: heroBackground(slotBIndex) }}
                />

                <div className="hero-shade" aria-hidden="true" />

                <div className="hero-topline">
                  <span>Цифровая библиотека</span>
                  <span>{counter}</span>
                </div>

                <div className="hero-content">

                  <p className="eyebrow">AN.KI ATLAS</p>

                  <h1>
                    Вся мировая литература.<br />
                    В одном пространстве.
                  </h1>

                  <p className="hero-copy">
                    Читайте книги на языке оригинала или в переводе.
                    Выделяйте сложные фрагменты и получайте объяснение,
                    не покидая текст.
                  </p>

                  <div className="hero-actions">
                    <button className="primary-button" type="button" onClick={onOpenSearch}>
                      Найти книгу
                    </button>
                    <a className="text-link" href="#collections">Открыть подборки</a>
                  </div>

                </div>

                <div className="hero-controls" aria-label="Управление изображениями">
                  <button type="button" aria-label="Предыдущее изображение" onClick={goPrevious}>←</button>
                  <button type="button" aria-label="Следующее изображение" onClick={goNext}>→</button>
                </div>

              </section>
            );

          }
          __PHASE2_FILE_EOF__

      - name: Write Phase 2 files (part 2/7)
