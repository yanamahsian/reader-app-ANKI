name: Bootstrap Phase 2 file tree

# ONE-TIME, manually triggered workflow. Run it once from the Actions
# tab ("Run workflow"). It wipes the repository's tracked working tree
# (except .git) -- which clears out the files that were accidentally
# flattened into the repo root during a failed web upload -- and
# rewrites the entire Phase 2 project with the correct nested folder
# structure, using a GitHub-hosted runner instead of the web upload UI
# (which does not preserve folder paths).
#
# File contents are written across several separate `run:` steps
# rather than one single step, because GitHub Actions caps any single
# workflow value (including a `run: |` block) at 21,000 characters;
# each step below is kept well under that limit. Large files
# (src/styles/global.css) are themselves split across steps using
# `cat >>` to append.
#
# Safe to delete this workflow file afterwards; it is not needed again
# once the tree is correct.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean working tree
        run: |
          set -e
          echo "Removing everything except .git (clears stray root files from the failed upload)..."
          for item in $(ls -A); do
            if [ "$item" = ".git" ]; then continue; fi
            rm -rf -- "$item"
          done
      - name: Write Phase 2 files (part 1/7)
        run: |
          set -e
          mkdir -p ".github/workflows"
          cat > ".github/workflows/deploy.yml" << '__PHASE2_FILE_EOF__'
          name: Deploy to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20

                - name: Install dependencies
                  # TEMPORARY (first Phase 2 deployment): no package-lock.json
                  # exists yet, so `npm ci` cannot run and `cache: npm` above is
                  # deliberately omitted (it requires a lockfile to key the
                  # cache off). Once a real package-lock.json is generated and
                  # committed separately, switch this back to `npm ci` and
                  # restore `cache: npm` on setup-node for faster, reproducible
                  # installs.
                  run: npm install

                - name: Build
                  run: npm run build

                - name: Upload build artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: dist

            deploy:
              needs: build
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          __PHASE2_FILE_EOF__

          cat > ".gitignore" << '__PHASE2_FILE_EOF__'
          node_modules
          dist
          .DS_Store
          *.local
          __PHASE2_FILE_EOF__

          cat > "index.html" << '__PHASE2_FILE_EOF__'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1, viewport-fit=cover"
            >

            <meta
              name="description"
              content="AN.KI Atlas — интеллектуальная библиотека и читалка без границ."
            >

            <meta name="theme-color" content="#100b09">

            <title>AN.KI Atlas</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

            <link
              href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
              rel="stylesheet"
            >
          </head>

          <body class="theme-dark">

            <div id="root"></div>

            <script type="module" src="/src/main.tsx"></script>

          </body>
          </html>
          __PHASE2_FILE_EOF__

          cat > "package.json" << '__PHASE2_FILE_EOF__'
          {
            "name": "reader-app-anki",
            "private": true,
            "version": "2.2.0",
            "type": "module",
