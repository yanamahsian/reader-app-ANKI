            position: relative;

            min-height: 100vh;

            background: var(--reader-bg);
            color: var(--reader-text);
          }

          .reader-view button {
            min-height: 42px;

            padding: 9px 13px;

            border: 1px solid var(--reader-border);
            border-radius: 10px;

            background: var(--reader-button);
            color: var(--reader-text);

            font-size: 13px;
            font-weight: 500;
          }

          .reader-view button:hover {
            background: var(--reader-button-hover);
            border-color: var(--reader-gold-soft);
          }

          .reader-overlay {
            position: fixed;
            inset: 0 auto auto 0;

            z-index: 120;

            width: 100%;

            pointer-events: none;

            opacity: 0;
            transition: opacity 0.2s ease;
          }

          .reader-overlay.visible {
            opacity: 1;
          }

          .reader-overlay-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;

            padding: 14px 16px 4px;

            pointer-events: auto;
          }

          .reader-overlay-actions {
            display: flex;
            gap: 7px;
          }

          .chapter-line {
            position: fixed;
            top: 12px;
            left: 50%;

            z-index: 90;

            max-width: 58vw;

            transform: translateX(-50%);

            overflow: hidden;

            color: var(--reader-meta);

            font-size: 12px;
            line-height: 1;
            letter-spacing: 0.04em;
            text-align: center;

            text-overflow: ellipsis;
            white-space: nowrap;

            pointer-events: none;
          }

          .remaining-line {
            position: fixed;
            bottom: 15px;
            left: 50%;

            z-index: 90;

            transform: translateX(-50%);

            color: var(--reader-meta);

            font-size: 12px;
            letter-spacing: 0.03em;
            text-align: center;
            white-space: nowrap;

            pointer-events: none;
          }

          .reader-shell {
            position: relative;

            min-height: 100vh;

            padding: 62px 20px 48px;
          }

          .viewer-text {
            width: 100%;
            max-width: 760px;

            min-height: calc(100vh - 110px);

            margin: 0 auto;

            background: transparent;
            color: var(--reader-text);

            font-family: "Cormorant Garamond", serif;
            font-size: 22px;
            font-weight: 400;
            line-height: 1.9;

            white-space: pre-wrap;
            overflow-wrap: break-word;

            user-select: text;
            -webkit-user-select: text;
          }

          .viewer-text p {
            margin: 0 0 1.25em;
          }

          .viewer-text::selection,
          .viewer-text p::selection {
            background: var(--reader-gold-soft);
            color: var(--reader-text);
          }

          .tap-zone {
            position: fixed;
            top: 0;
            bottom: 0;

            z-index: 20;
          }

          .tap-zone-left {
            left: 0;
            width: 26%;
          }

          .tap-zone-center {
            left: 26%;
            width: 48%;
          }

          .tap-zone-right {
            right: 0;
            width: 26%;
          }


          /* =========================================================
             SELECTION TOOLBAR
             ========================================================= */

          .selection-toolbar {
            position: fixed;

            z-index: 999999;

            display: none;
            gap: 6px;

            padding: 7px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;

            background: var(--reader-toolbar);

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
          }

          .selection-toolbar button {
            min-height: auto;

            padding: 7px 10px;

            border: 1px solid transparent;
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.08);
            color: #f2f2ef;

            font-size: 12px;
          }


          /* =========================================================
             ACTION SHEET
             ========================================================= */

          .sheet-backdrop {
            position: fixed;
            inset: 0;

            z-index: 140;

            background: rgba(0, 0, 0, 0.42);

            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
          }

          .action-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            z-index: 150;

            max-height: 74vh;

            padding: 10px 16px 20px;

            overflow: auto;

            border: 1px solid var(--reader-border);
            border-bottom: none;

            border-top-left-radius: 22px;
            border-top-right-radius: 22px;

            background: var(--reader-sheet);
            color: var(--reader-text);

            box-shadow: 0 -14px 45px rgba(0, 0, 0, 0.32);
          }

          .sheet-handle {
            width: 44px;
            height: 3px;

            margin: 1px auto 14px;

            border-radius: 999px;

            background: var(--reader-gold-soft);
          }

          .sheet-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-bottom: 12px;
          }

          .sheet-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 24px;
          }

          .selected-text-box,
          .action-result {
            padding: 13px 15px;

            border: 1px solid var(--reader-border);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.025);

            line-height: 1.65;
            white-space: pre-wrap;
          }

          .selected-text-box {
            max-height: 170px;

            margin-bottom: 12px;

            overflow: auto;

            color: var(--reader-meta);

            font-family: "Cormorant Garamond", serif;
            font-size: 17px;
          }

          .sheet-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            margin-bottom: 12px;
          }

          .action-result {
            min-height: 80px;

            font-family: "Cormorant Garamond", serif;
            font-size: 17px;
          }
          /* =========================================================
             MOBILE
             ========================================================= */

          @media (max-width: 1100px) {

            :root{
              --home-sidebar:0px;
            }

            .site-sidebar{
              transform:translateX(-100%);
              transition:transform .3s ease;
              width:290px;
            }

            .site-sidebar.open{
              transform:translateX(0);
            }

            .sidebar-backdrop{
              position:fixed;
              inset:0;
              z-index:999;
              background:rgba(0,0,0,.55);
              backdrop-filter:blur(2px);
            }

            .mobile-header{
              position:fixed;
              top:0;
              left:0;
              right:0;
              z-index:950;

              height:64px;

              display:flex;
              align-items:center;
              justify-content:space-between;

              padding:0 18px;

              background:rgba(16,11,9,.92);
              backdrop-filter:blur(18px);
            }

            .mobile-brand{
              font-family:"Cormorant Garamond",serif;
              font-size:30px;
              letter-spacing:.12em;
            }

            .mobile-brand span{
              display:block;
              color:var(--home-gold);
              font-size:9px;
              letter-spacing:.45em;
              text-align:center;
            }

            .icon-button{
              width:42px;
              height:42px;
            }

            .mobile-menu-close{
              display:block;

              position:absolute;
              right:18px;
              top:18px;

              width:40px;
              height:40px;
            }

            .home-main{
              margin-left:0;
            }

            .hero{
              min-height:100svh;
              padding-top:64px;
            }

            .hero-content{
              left:30px;
              right:30px;
              width:auto;
              bottom:70px;
            }

            .hero h1{
              font-size:58px;
            }

            .hero-copy{
              font-size:19px;
            }

            .hero-topline{
              top:84px;
              left:30px;
              right:30px;
            }

            .hero-controls{
              right:24px;
              bottom:24px;
            }

            .collection-grid{
              grid-template-columns:1fr;
            }

            .collection-card-featured{
              grid-row:auto;
              min-height:420px;
            }

            .academy-panel{
              grid-template-columns:1fr;
            }

            .academy-index{
              border-left:none;
              border-top:1px solid var(--home-border);
            }

          }

          @media (max-width:760px){

            .editorial-section{
              padding:72px 24px;
            }

            .section-heading{
              display:block;
            }

            .section-link{
              margin-top:18px;
            }

            .hero h1{
              font-size:44px;
            }

            .hero-copy{
              font-size:18px;
            }

            .hero-actions{
              display:flex;
              flex-direction:column;
              align-items:flex-start;
              gap:18px;
            }

            .collection-card{
              min-height:260px;
            }

            .collection-card-featured{
              min-height:330px;
            }

            .collection-card h3{
              font-size:34px;
            }

            .author-list button{
              display:block;
            }

            .author-list button span:last-child{
              display:block;
              margin-top:8px;
            }

            .academy-copy h2{
              font-size:48px;
            }

            .academy-copy>p:not(.eyebrow){
              font-size:18px;
            }

            .site-footer{
              display:block;
            }

            .site-footer p{
              margin-top:12px;
            }

            .reader-shell{
              padding-left:16px;
              padding-right:16px;
            }

            .viewer-text{
              font-size:20px;
              line-height:1.8;
            }

            .reader-overlay-top{
              flex-direction:column;
              align-items:stretch;
            }

            .reader-overlay-actions{
              justify-content:space-between;
            }

          }

          @media (max-width:480px){

            .hero-content{
              left:22px;
              right:22px;
              bottom:48px;
            }

            .hero h1{
              font-size:38px;
            }

            .hero-copy{
              margin-top:20px;
              font-size:17px;
            }

            .primary-button{
              width:100%;
            }

            .search-panel{
              width:100%;
              padding:24px;
            }

            .viewer-text{
              font-size:19px;
            }

          }


          /* =========================================================
             SCROLLBAR
             ========================================================= */

          ::-webkit-scrollbar{
              width:10px;
              height:10px;
          }

          ::-webkit-scrollbar-track{
              background:#120d0a;
          }

          ::-webkit-scrollbar-thumb{
              background:#5d4322;
          }

          ::-webkit-scrollbar-thumb:hover{
              background:#8f6938;
          }

          ::selection{
              background:rgba(202,160,88,.35);
              color:#fff;
          }


          /* =========================================================
             ANIMATIONS
             ========================================================= */

          .fade-in{
              animation:fadeIn .6s ease both;
          }

          @keyframes fadeIn{

              from{
                  opacity:0;
                  transform:translateY(16px);
              }

              to{
                  opacity:1;
                  transform:none;
              }

          }

          @keyframes heroZoom{

              from{
                  transform:scale(1.04);
              }

              to{
                  transform:scale(1);
              }

          }

          .hero-image.active{
              animation:heroZoom 10s linear forwards;
          }

          /* =========================================================
             STEP 1 ADDITIONS
             Elements already produced by script.js that had no
             matching styles yet: toasts, loading/error states,
             the free-question textarea.
             ========================================================= */

          .search-error,
          .empty-state,
          .sheet-error {
            padding: 16px 0;

            color: var(--home-muted);
            font-size: 14px;
            text-align: center;
          }

          .sheet-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

            padding: 20px 0;

            color: var(--reader-meta);
            font-size: 13px;
          }

          .loader {
            width: 22px;
            height: 22px;

            border: 2px solid var(--reader-border);
            border-top-color: var(--reader-gold);
            border-radius: 50%;

            animation: loaderSpin 0.8s linear infinite;
          }

          @keyframes loaderSpin {
            to {
              transform: rotate(360deg);
            }
          }

          .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;

            z-index: 999999;

            transform: translate(-50%, 12px);

            padding: 10px 18px;

            border: 1px solid var(--reader-border);
            border-radius: 999px;

            background: var(--reader-sheet);
            color: var(--reader-text);

            font-size: 13px;

            opacity: 0;
            pointer-events: none;

            transition:
              opacity 0.25s ease,
              transform 0.25s ease;
          }

          .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
          }
          __PHASE2_FILE_EOF__

          mkdir -p "src"
          cat > "src/vite-env.d.ts" << '__PHASE2_FILE_EOF__'
          /// <reference types="vite/client" />
          __PHASE2_FILE_EOF__

          cat > "tsconfig.json" << '__PHASE2_FILE_EOF__'
          {
            "compilerOptions": {
              "target": "ES2021",
              "useDefineForClassFields": true,
              "lib": ["ES2021", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,

              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",

              "strict": true,
              "noUnusedLocals": true,
              "noUnusedParameters": true,
              "noFallthroughCasesInSwitch": true

            },
            "include": ["src", "vite.config.ts"]
          }
          __PHASE2_FILE_EOF__

          cat > "vite.config.ts" << '__PHASE2_FILE_EOF__'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          // This is a GitHub Pages *project* page
          // (https://yanamahsian.github.io/reader-app-ANKI/), not a user/org page,
          // so every asset must be resolved under this subpath, not the domain root.
          export default defineConfig({
            base: "/reader-app-ANKI/",
            plugins: [react()]
          });
          __PHASE2_FILE_EOF__

      - name: Create public asset folders
        run: |
          set -e
          mkdir -p public/Hero public/books
          touch public/Hero/.gitkeep public/books/.gitkeep
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rebuild Phase 2 file tree via bootstrap workflow" || echo "Nothing to commit"
          git push origin HEAD:main
