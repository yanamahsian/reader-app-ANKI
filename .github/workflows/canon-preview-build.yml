name: Canon branch build

on:
  push:
    branches:
      - atlas-the-canon-ui-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Canon branch
        env:
          VITE_PADDLE_ENV: sandbox
          VITE_PADDLE_CLIENT_TOKEN: test_e66a8f24d3ad650a9cd1de261a9
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: canon-preview-dist
          path: dist
          if-no-files-found: error
