name: Diagnose Subscription AI Entitlements Transport

on:
  push:
    branches:
      - tmp-entitlements-transport
    paths:
      - '.github/workflows/integrate-0010-entitlements.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport
        uses: actions/checkout@v4
        with:
          ref: tmp-entitlements-transport
          fetch-depth: 0

      - name: Print exact transport hashes
        shell: bash
        run: |
          set -u
          wc -c .tmp/entitlements/chunk0a.b64 .tmp/entitlements/chunk0b.b64 .tmp/entitlements/chunk0c.b64 .tmp/entitlements/chunk1.b64 .tmp/entitlements/chunk2.b64 .tmp/entitlements/chunk3.b64 .tmp/entitlements/chunk4.b64
          sha256sum .tmp/entitlements/chunk0a.b64 .tmp/entitlements/chunk0b.b64 .tmp/entitlements/chunk0c.b64 .tmp/entitlements/chunk1.b64 .tmp/entitlements/chunk2.b64 .tmp/entitlements/chunk3.b64 .tmp/entitlements/chunk4.b64
