name: Paddle 0014 Final Academy Gate

on:
  push:
    branches: [paddle-0014-assembler]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assembler branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage correction script
        run: |
          test -f .integration/disable_academy.py
          cp .integration/disable_academy.py /tmp/disable_academy.py
          python -m py_compile /tmp/disable_academy.py

      - name: Apply correction to current ready branch
        run: |
          git checkout -B paddle-subscription-lifecycle-v1-ready origin/paddle-subscription-lifecycle-v1-ready
          python /tmp/disable_academy.py
          git diff --check
          grep -Fq 'if (planDef.id === "academy")' src/features/subscription/SubscriptionView.tsx
          test "$(grep -F 'error: "plan_not_available"' supabase/functions/paddle-checkout/index.ts | wc -l)" -eq 2

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build with exact production Paddle env
        env:
          VITE_PADDLE_ENV: sandbox
          VITE_PADDLE_CLIENT_TOKEN: test_e66a8f24d3ad650a9cd1de261a9
        run: |
          npm run build
          test -f dist/index.html
          grep -R -Fq 'test_e66a8f24d3ad650a9cd1de261a9' dist

      - name: Commit and publish corrected ready branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/subscription/SubscriptionView.tsx supabase/functions/paddle-checkout/index.ts
          git diff --cached --quiet && exit 1 || true
          git commit -m "Disable Academy recurring checkout until product launch"
          git push origin HEAD:refs/heads/paddle-subscription-lifecycle-v1-ready
