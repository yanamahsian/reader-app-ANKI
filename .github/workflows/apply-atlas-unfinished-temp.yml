name: Diagnose Atlas Unfinished patch staging (temporary)

on:
  push:
    branches:
      - integrate-atlas-unfinished-lines-v1-transfer
    paths:
      - .github/workflows/apply-atlas-unfinished-temp.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunks
        run: |
          for f in .tmp/atlas-unfinished.part0{1..8}.b64 .tmp/atlas-unfinished.tail0{1..7}.b64; do
            echo "--- $f ---"
            wc -c "$f"
            sha256sum "$f"
            if LC_ALL=C grep -n '[^A-Za-z0-9+/=]' "$f"; then
              echo "INVALID CHARS in $f"
            else
              echo "chars-ok"
            fi
          done
