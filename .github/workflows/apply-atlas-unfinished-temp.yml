name: Diagnose Atlas Unfinished patch boundaries (temporary)

on:
  push:
    branches:
      - integrate-atlas-unfinished-lines-v1-transfer
    paths:
      - .github/workflows/apply-atlas-unfinished-temp.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          names = [*(f'.tmp/atlas-unfinished.part{i:02d}.b64' for i in range(1,10)), *(f'.tmp/atlas-unfinished.tail{i:02d}.b64' for i in range(1,8))]
          total = ''
          offset = 0
          for name in names:
              s = Path(name).read_text()
              eq = [i for i,c in enumerate(s) if c == '=']
              print(name, 'len=', len(s), 'mod4=', len(s)%4, 'eq=', eq[:10], 'start=', repr(s[:12]), 'end=', repr(s[-12:]))
              if eq and name != names[-1]:
                  print('MIDSTREAM_PADDING', name, eq)
              total += s
              offset += len(s)
          print('TOTAL', len(total), 'mod4=', len(total)%4, 'eq_count=', total.count('='), 'first_eq=', total.find('='), 'last_eq=', total.rfind('='))
          import base64
          try:
              data = base64.b64decode(total, validate=True)
              print('DECODE_OK', len(data))
              import hashlib
              print('PATCH_SHA256', hashlib.sha256(data).hexdigest())
          except Exception as e:
              print('DECODE_ERROR', repr(e))
              raise
          PY
