name: Apply Atlas Contradictions patch (temporary)

on:
  push:
    branches:
      - integrate-atlas-contradictions-exact

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate exact patch
        shell: bash
        run: |
          cat .tmp/patch.b64.* | tr -d '\n' | base64 -d > /tmp/atlas-contradictions.diff
          git apply --check /tmp/atlas-contradictions.diff

      - name: Apply patch and remove staging artifacts
        shell: bash
        run: |
          git apply /tmp/atlas-contradictions.diff
          rm -rf .tmp
          rm -f .github/workflows/apply-atlas-contradictions-temp.yml
          git add -A
          git diff --cached --check
          echo 'Changed files:'
          git diff --cached --name-only

      - name: Commit exact patch result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Atlas Contradictions v1"
          git push origin HEAD:integrate-atlas-contradictions-exact
