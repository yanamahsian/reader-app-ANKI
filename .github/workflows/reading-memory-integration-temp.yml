name: Reading Memory integration

on:
  push:
    branches: [reading-memory-integration-20260829]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring validated Reading Memory files onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin notes-v2-clean-20260826
          NOTES_SHA=20714c7de8a16912851545b7be312f31157ec2af
          git checkout "$NOTES_SHA" -- \
            src/api/annotations.ts \
            src/catalog/toReaderBook.ts \
            src/features/notes/NotesView.tsx \
            src/features/reader/ReaderView.tsx \
            src/features/reader/annotationStore.ts \
            src/features/reader/engine/highlightAnchor.ts \
            src/features/reader/engine/readerEngine.ts \
            src/features/reader/engine/selection.ts \
            src/features/reader/engine/types.ts \
            src/styles/global.css

          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { NotesView } from "./features/notes/NotesView";\n',
              'import { NotesView } from "./features/notes/NotesView";\nimport type { ReaderNavigationTarget } from "./features/reader/ReaderView";\n',
              'ReaderNavigationTarget import'
          )

          replace_once(
              '  | { type: "atlas" }\n  | { type: "my-library"; state: MyLibraryRestoreState };\n',
              '  | { type: "atlas" }\n  | { type: "my-library"; state: MyLibraryRestoreState }\n  | { type: "notes" };\n',
              'notes BookDetailOrigin'
          )

          replace_once(
              '  const [bookDetailInitialEdition, setBookDetailInitialEdition] =\n    useState<{ editionId: string; language: string } | null>(\n      initialNavigation.bookDetailInitialEdition ?? null\n    );\n\n  const [selectedAuthorId, setSelectedAuthorId] = useState<string | null>(\n',
              '  const [bookDetailInitialEdition, setBookDetailInitialEdition] =\n    useState<{ editionId: string; language: string } | null>(\n      initialNavigation.bookDetailInitialEdition ?? null\n    );\n\n  // Reading Memory: used only when Notes asks Reader to reopen an exact saved fragment.\n  // It is intentionally not persisted in sessionStorage: after a refresh Reader falls back\n  // to the ordinary saved reading position rather than replaying a one-shot deep link.\n  const [readerNavigationTarget, setReaderNavigationTarget] =\n    useState<ReaderNavigationTarget | null>(null);\n\n  const [selectedAuthorId, setSelectedAuthorId] = useState<string | null>(\n',
              'reader navigation target state'
          )

          replace_once(
              '  function handleOpenBook(book: Book): void {\n    setCurrentBook(book);\n    setView("reader");\n  }\n',
              '  function handleOpenBook(book: Book): void {\n    setCurrentBook(book);\n    setReaderNavigationTarget(null);\n    setView("reader");\n  }\n\n  function handleOpenAnnotationInReader(book: Book, target: ReaderNavigationTarget): void {\n    setReaderNavigationTarget(target);\n    setCurrentBook(book);\n    setView("reader");\n  }\n',
              'annotation reader handler'
          )

          replace_once(
              '    if (bookDetailOrigin?.type === "my-library") {\n      setMyLibraryRestoreState(bookDetailOrigin.state);\n      setView("my-library");\n      return;\n    }\n\n    if (bookDetailOrigin?.type === "atlas") {\n',
              '    if (bookDetailOrigin?.type === "my-library") {\n      setMyLibraryRestoreState(bookDetailOrigin.state);\n      setView("my-library");\n      return;\n    }\n\n    if (bookDetailOrigin?.type === "notes") {\n      setView("notes");\n      return;\n    }\n\n    if (bookDetailOrigin?.type === "atlas") {\n',
              'notes back navigation'
          )

          replace_once(
              '  function handleOpenBookDetailFromMyLibrary(\n    bookId: string,\n    state: MyLibraryRestoreState,\n    initialEdition: { editionId: string; language: string } | null\n  ): void {\n    handleOpenBookDetail(bookId, { type: "my-library", state }, initialEdition);\n  }\n\n  function handleRequireSignIn(): void {\n',
              '  function handleOpenBookDetailFromMyLibrary(\n    bookId: string,\n    state: MyLibraryRestoreState,\n    initialEdition: { editionId: string; language: string } | null\n  ): void {\n    handleOpenBookDetail(bookId, { type: "my-library", state }, initialEdition);\n  }\n\n  function handleOpenBookDetailFromNotes(bookId: string): void {\n    handleOpenBookDetail(bookId, { type: "notes" });\n  }\n\n  function handleRequireSignIn(): void {\n',
              'notes book detail handler'
          )

          replace_once(
              '  if (view === "reader" && currentBook) {\n    return <ReaderView book={currentBook} onExit={handleExitReader} />;\n  }\n',
              '  if (view === "reader" && currentBook) {\n    return (\n      <ReaderView\n        book={currentBook}\n        onExit={handleExitReader}\n        navigationTarget={readerNavigationTarget}\n      />\n    );\n  }\n',
              'ReaderView navigationTarget prop'
          )

          replace_once(
              '  } else if (view === "notes") {\n    content = <NotesView onBack={handleBackFromAccountShell} />;\n  } else if (view === "subscription") {\n',
              '  } else if (view === "notes") {\n    content = (\n      <NotesView\n        onBack={handleBackFromAccountShell}\n        onOpenBookDetail={handleOpenBookDetailFromNotes}\n        onOpenAnnotationInReader={handleOpenAnnotationInReader}\n        onRequireSignIn={handleRequireSignIn}\n        onOpenLibrary={handleOpenLibrary}\n      />\n    );\n  } else if (view === "subscription") {\n',
              'NotesView wiring'
          )

          path.write_text(text)
          PY

          git diff --check

      - name: Install dependencies
        run: |
          npm install --no-package-lock
          npm install --no-save --no-package-lock @types/node

      - name: Typecheck current integration
        run: npx tsc --noEmit

      - name: Run Reading Memory overlap regression test
        shell: bash
        run: |
          set -euo pipefail
          git show 20714c7de8a16912851545b7be312f31157ec2af:src/features/reader/engine/highlightAnchor.overlap.test.ts > src/features/reader/engine/highlightAnchor.overlap.test.ts
          rm -rf /tmp/reading-memory-overlap-test
          npx tsc --target ES2021 --module commonjs --moduleResolution node --types node --esModuleInterop --skipLibCheck --outDir /tmp/reading-memory-overlap-test src/features/reader/engine/highlightAnchor.ts src/features/reader/engine/highlightAnchor.overlap.test.ts
          node /tmp/reading-memory-overlap-test/highlightAnchor.overlap.test.js
          rm src/features/reader/engine/highlightAnchor.overlap.test.ts

      - name: Build current application
        run: npm run build

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reading-memory-integration-temp.yml
          git add \
            src/App.tsx \
            src/api/annotations.ts \
            src/catalog/toReaderBook.ts \
            src/features/notes/NotesView.tsx \
            src/features/reader/ReaderView.tsx \
            src/features/reader/annotationStore.ts \
            src/features/reader/engine/highlightAnchor.ts \
            src/features/reader/engine/readerEngine.ts \
            src/features/reader/engine/selection.ts \
            src/features/reader/engine/types.ts \
            src/styles/global.css
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate Reading Memory v1'
          git push origin HEAD:reading-memory-integration-20260829
