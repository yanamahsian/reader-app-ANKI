name: Assemble omnia-ai v16

on:
  push:
    branches:
      - sync-omnia-ai-v16
    paths:
      - .github/workflows/sync-omnia-ai-v16.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-omnia-ai-v16
          fetch-depth: 0

      - name: Assemble exact production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/omnia-ai
          cat .tmp/omnia-ai-v16/part*.txt > supabase/functions/omnia-ai/index.ts
          echo "28994f85209ebcb5d86753805307145d6addd4fdffa4ded90506049d06abe295  supabase/functions/omnia-ai/index.ts" | sha256sum -c -
          test "$(wc -l < supabase/functions/omnia-ai/index.ts)" -eq 1816

      - name: Commit canonical source and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/omnia-ai/index.ts
          git rm -r .tmp/omnia-ai-v16
          git rm .github/workflows/sync-omnia-ai-v16.yml
          git commit -m "Sync production omnia-ai v16 source"
          git push origin HEAD:sync-omnia-ai-v16
