name: Atlas v1 gate

on:
  push:
    branches: [atlas-v1-no-ai]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atlas-v1-no-ai

      - name: Integrate Atlas
        run: python .atlas-integrate.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Deterministic Atlas smoke test
        run: npx --yes tsx .atlas-smoke.ts

      - name: Build
        run: npm run build

      - name: Commit verified implementation
        run: |
          rm .atlas-integrate.py .atlas-smoke.ts .github/workflows/atlas-v1-gate.yml
          git config user.name "AN.KI build bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement Atlas v1 without paid AI"
          git push origin HEAD:atlas-v1-no-ai
