name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Deliberately false (not true) for the Pages deploy workflow: if a
  # new run cancels a deployment mid-creation on GitHub's side, the
  # "github-pages" environment can be left in an inconsistent state
  # that then makes every subsequent deployment-creation call fail
  # with a 502, even on retry. This matches GitHub's own official
  # static-site Pages workflow template, which uses false here for
  # the same reason.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Uses npm ci when a real package-lock.json is present (fast,
        # reproducible); falls back to npm install otherwise, since a
        # lockfile has not been generated for this repo yet.
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci"
            npm ci
          else
            echo "No package-lock.json yet — using npm install"
            npm install
          fi

      - name: Build
        env:
          VITE_PADDLE_ENV: sandbox
          VITE_PADDLE_CLIENT_TOKEN: test_e66a8f24d3ad650a9cd1de261a9
        run: npm run build

      - name: Verify build output exists
        # Fails loudly here instead of silently deploying an empty or
        # stale artifact if `vite build` did not produce dist/.
        run: |
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html was not produced by the build — aborting."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
