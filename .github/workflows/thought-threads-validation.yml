name: Thought Threads v1 validation

on:
  push:
    branches: [thought-threads-v1-20260829]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
