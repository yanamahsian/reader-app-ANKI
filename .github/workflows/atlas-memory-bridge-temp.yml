name: Atlas Memory Bridge validation

on:
  push:
    branches:
      - atlas-memory-bridge-v1-20260829

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Atlas exact-memory navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''  function handleOpenAnnotationInReader(book: Book, target: ReaderNavigationTarget): void {
              setReaderNavigationTarget(target);
              setCurrentBook(book);
              setView("reader");
            }
          '''
          new = '''  function handleOpenAnnotationInReader(
              book: Book,
              target: ReaderNavigationTarget,
              origin: "notes" | "atlas" = "notes"
            ): void {
              // Reading Memory deep-links should have a deterministic exit path too:
              // Reader -> Book Detail -> the surface that opened the saved fragment.
              setSelectedBookId(book.workId ?? null);
              setBookDetailOrigin(book.workId ? { type: origin } : null);
              setReaderNavigationTarget(target);
              setCurrentBook(book);
              setView("reader");
            }
          '''
          if old not in s:
              raise SystemExit('Reading Memory handler shape changed; refusing blind patch')
          s = s.replace(old, new, 1)

          old_atlas = '''      <AtlasView
                onBack={handleBackFromAccountShell}
                onOpenBookDetail={bookId => handleOpenBookDetail(bookId, { type: "atlas" })}
                onRequireSignIn={handleRequireSignIn}
              />'''
          new_atlas = '''      <AtlasView
                onBack={handleBackFromAccountShell}
                onOpenBookDetail={bookId => handleOpenBookDetail(bookId, { type: "atlas" })}
                onOpenAnnotationInReader={(book, target) => handleOpenAnnotationInReader(book, target, "atlas")}
                onRequireSignIn={handleRequireSignIn}
              />'''
          if old_atlas not in s:
              raise SystemExit('Atlas invocation shape changed; refusing blind patch')
          s = s.replace(old_atlas, new_atlas, 1)
          p.write_text(s)
          PY
          git diff --check

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit validated bridge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Wire Atlas Reading Memory navigation'
          git push origin HEAD:atlas-memory-bridge-v1-20260829
