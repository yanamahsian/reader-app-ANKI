name: Apply language facets sync 2

on:
  push:
    branches:
      - language-facets-sync2-20260826
    paths:
      - '.github/workflows/apply-language-facets-sync2.yml'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "49e0ff8ae98275ce54060f6f63abbb210fc2d4f4"

      - name: Assemble uploaded patch
        run: |
          cat .tmp/facet.part0 .tmp/facet.part1 .tmp/facet.part2 .tmp/facet.part3 .tmp/facet.part4 > /tmp/facets.b64
          test "$(wc -c < /tmp/facets.b64)" = "13964"
          base64 -d /tmp/facets.b64 > /tmp/facets.patch.gz
          gzip -t /tmp/facets.patch.gz
          gunzip -c /tmp/facets.patch.gz > /tmp/anki_language_facets.patch
          test "$(wc -c < /tmp/anki_language_facets.patch)" = "31438"

      - name: Validate patch against main
        run: git apply --check /tmp/anki_language_facets.patch

      - name: Apply patch
        run: git apply /tmp/anki_language_facets.patch

      - name: Remove transfer-only files
        run: |
          rm -rf .tmp
          rm .github/workflows/apply-language-facets-sync2.yml

      - name: Verify exact scope
        run: |
          git add -N supabase/sql/library_language_facets.sql
          expected=$(printf '%s\n' \
            'src/api/libraryCatalog.ts' \
            'src/catalog/languages.ts' \
            'src/features/home/SearchPanel.tsx' \
            'src/features/library/LibraryView.tsx' \
            'supabase/functions/omnia-library-catalog/index.ts' \
            'supabase/sql/library_language_facets.sql' | sort)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$expected"
          git diff --check origin/main

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified facets sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add server-driven language facets'
          git push origin HEAD:language-facets-sync2-20260826
